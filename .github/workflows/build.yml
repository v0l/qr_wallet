name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"
  FLUTTER_CHANNEL: "stable"

jobs:
  # ---------------------------------------------------------------- Analyze ---
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze

  # ---------------------------------------------------------------- Android ---
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Build App Bundle (release)
        run: flutter build appbundle --release
      - name: Rename outputs
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk qr-wallet-android.apk
          mv build/app/outputs/bundle/release/app-release.aab qr-wallet-android.aab
      # NOTE: GitHub always wraps downloaded artifacts in a .zip. For a
      # directly installable APK use the rolling `nightly` release (main) or a
      # tagged release, where assets are attached raw.
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: qr-wallet-android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: qr-wallet-android.aab
          if-no-files-found: error

  # -------------------------------------------------------------------- iOS ---
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y "$GITHUB_WORKSPACE/qr_wallet-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: qr_wallet-ios-unsigned.ipa
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS ---
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build macOS (release)
        run: flutter build macos --release
      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/qr_wallet-macos.zip" "QR Wallet.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: qr_wallet-macos.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux ---
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build Linux (release)
        run: flutter build linux --release
      - name: Tar bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/qr_wallet-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: qr_wallet-linux-x64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows ---
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath qr_wallet-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: qr_wallet-windows-x64.zip
          if-no-files-found: error

  # -------------------------------------------------------------------- Web ---
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build Web (release)
        run: flutter build web --release
      - name: Tar bundle
        run: tar czf "$GITHUB_WORKSPACE/qr_wallet-web.tar.gz" -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: qr_wallet-web.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------- Release (on tags) -----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, macos, linux, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p out
          find dist -type f -exec mv {} out/ \;
          ls -la out
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

  # ------------------------------------- Rolling nightly release (on main) ----
  # Artifacts from the Actions UI are always zipped; this attaches the raw
  # files (installable .apk, etc.) to a rolling pre-release instead.
  nightly:
    if: github.ref == 'refs/heads/main'
    needs: [android, ios, macos, linux, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p out
          find dist -type f -exec mv {} out/ \;
          ls -la out
      - name: Move nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly
      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (${{ github.sha }})
          body: |
            Automatic build of `main` @ ${{ github.sha }}.

            Download `qr-wallet-android.apk` and install it directly.
          prerelease: true
          make_latest: false
          files: out/*
